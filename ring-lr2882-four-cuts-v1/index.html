 <script>
 (()=>{
  const models=JSON.parse(document.getElementById('models').textContent),choices=document.getElementById('choices'),stage=document.getElementById('stage'),separate=document.getElementById('separate');
  let current=null;
  function choose(product){
   const m=models.find(m=>m.product===product)||models[0];if(current===m.product)return;current=m.product;
   const frame=document.createElement('iframe');frame.title=m.label+' · '+m.product;frame.src=m.url;stage.replaceChildren(frame);separate.href=m.url;
   for(const button of choices.children)button.setAttribute('aria-pressed',String(button.dataset.product===m.product));
   if(location.hash.slice(1)!==m.product)history.replaceState(null,'','#'+m.product);
  }
  for(const m of models){const button=document.createElement('button');button.type='button';button.dataset.product=m.product;button.textContent=m.label;button.addEventListener('click',()=>choose(m.product));choices.append(button);}
  window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));choose(location.hash.slice(1));
 })();
