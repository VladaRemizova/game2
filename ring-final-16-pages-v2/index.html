<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><link rel="icon" href="data:,"><title>LA VIVION · 16 колец</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#353b38;font:14px Arial,sans-serif}body{height:100vh;height:100svh;display:flex;flex-direction:column}header{padding:18px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #e4e8e5}h1{font-size:17px;font-weight:500;margin:0}#families{margin-left:auto}.row{display:flex;gap:7px;flex-wrap:wrap}button{font:12px Arial;color:#536258;padding:10px 14px;min-height:40px;border:1px solid #dbe1dc;border-radius:8px;background:white;cursor:pointer}button[aria-pressed=true]{background:#edf2eb;border-color:#6d8071}button:focus-visible{outline:2px solid #7b9082;outline-offset:3px}#choices{padding:12px 24px;border-bottom:1px solid #eceeec}main{position:relative;flex:1;min-height:350px}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}footer{padding:10px 24px;font-size:11px;color:#7b8780}@media(max-width:760px){header{padding:12px 14px}#families{margin-left:0;display:grid;grid-template-columns:1fr 1fr;width:100%}#choices{padding:10px 14px;display:grid;grid-template-columns:repeat(4,1fr)}button{font-size:11px;padding:9px 8px}footer{padding:8px 14px}}</style></head><body>
<header><h1>LA VIVION</h1><div class="row" id="families" role="group" aria-label="Оправа"></div></header><div class="row" id="choices" role="group" aria-label="Огранка"></div><main id="stage"></main><footer id="product"></footer>
<script id="models" type="application/json">[{"product":"LR2882BR01","url":"LR2882BR01/index.html","cut":"BR","mount":"plain"},{"product":"LR2981BR01","url":"LR2981BR01/index.html","cut":"BR","mount":"pave"},{"product":"LR2906BR01","url":"LR2906BR01/index.html","cut":"BR","mount":"shoulder"},{"product":"LR5600BR01","url":"LR5600BR01/index.html","cut":"BR","mount":"halo"},{"product":"LR2882PR01","url":"LR2882PR01/index.html","cut":"PR","mount":"plain"},{"product":"LR2981PR01","url":"LR2981PR01/index.html","cut":"PR","mount":"pave"},{"product":"LR2906PR01","url":"LR2906PR01/index.html","cut":"PR","mount":"shoulder"},{"product":"LR2411PR01","url":"LR2411PR01/index.html","cut":"PR","mount":"halo"},{"product":"LR2882OV01","url":"LR2882OV01/index.html","cut":"OV","mount":"plain"},{"product":"LR2981OV01","url":"LR2981OV01/index.html","cut":"OV","mount":"pave"},{"product":"LR2082OV01","url":"LR2082OV01/index.html","cut":"OV","mount":"shoulder"},{"product":"LR0211OV01","url":"LR0211OV01/index.html","cut":"OV","mount":"halo"},{"product":"LR2882EM01","url":"LR2882EM01/index.html","cut":"EM","mount":"plain"},{"product":"LR2981EM01","url":"LR2981EM01/index.html","cut":"EM","mount":"pave"},{"product":"LR2906EM01","url":"LR2906EM01/index.html","cut":"EM","mount":"shoulder"},{"product":"LR3041EM01","url":"LR3041EM01/index.html","cut":"EM","mount":"halo"}]</script><script>(()=>{
 const models=JSON.parse(document.getElementById('models').textContent),families=document.getElementById('families'),choices=document.getElementById('choices'),stage=document.getElementById('stage');
 const assetData=document.getElementById('offline-assets');
 const offline=assetData?JSON.parse(assetData.textContent):null;
 const names={plain:'Классическая',pave:'С дорожкой',shoulder:'С боковыми камнями',halo:'С ободком'},cuts={BR:'Круг',OV:'Овал',PR:'Принцесса',EM:'Изумруд'};let current=null,frame=null;
 function loadViewer(frame,model){
  if(!offline){frame.src=model.url;return;}
  const end='<'+'/script>';
  const asset=(id,data,extra='')=>'<script id="'+id+'" type="application/octet-stream"'+extra+'>'+data+end;
  const bundle=data=>'<script src="data:text/javascript;base64,'+data+'">'+end;
  const source=asset('ring-data',offline.models[model.product])+asset('draco-wasm',offline.wasm)
   +asset('draco-wrapper',offline.wrapper,' data-base64="true"')+bundle(offline.viewer);
  frame.srcdoc=offline.pages[model.product]
   .replace('<script src="../viewer.js">'+end,source)
   .replace('<script src="../final-motion.js">'+end,bundle(offline.motion))
   .replace('__ENVIRONMENT__',model.cut==='EM'?asset('environment-diamond',offline.environmentDiamond):'');
 }
 function choose(product){const model=models.find(m=>m.product===product)||models[0];if(current?.product===model.product)return;frame?.contentWindow.ringViewer?.dispose?.();current=model;frame=document.createElement('iframe');frame.title=model.product;loadViewer(frame,model);stage.replaceChildren(frame);document.getElementById('product').textContent=model.product;for(const b of families.children)b.setAttribute('aria-pressed',String(b.dataset.mount===model.mount));for(const b of choices.children)b.setAttribute('aria-pressed',String(b.dataset.cut===model.cut));if(location.hash.slice(1)!==model.product)history.replaceState(null,'','#'+model.product);}
 for(const [mount,label]of Object.entries(names)){const b=document.createElement('button');b.type='button';b.dataset.mount=mount;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.mount===mount&&m.cut===current.cut).product));families.append(b);}
 for(const [cut,label]of Object.entries(cuts)){const b=document.createElement('button');b.type='button';b.dataset.cut=cut;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.cut===cut&&m.mount===current.mount).product));choices.append(b);}
 window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));choose(location.hash.slice(1));
})();</script></body></html>
