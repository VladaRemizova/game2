 <script>
 (()=>{
  const models=JSON.parse(document.getElementById('models').textContent),families=document.getElementById('families'),choices=document.getElementById('choices'),stage=document.getElementById('stage'),separate=document.getElementById('separate');
  const names={plain:'Классическая',pave:'С дорожкой',halo:'С ободком'},cuts={BR:'Круг',OV:'Овал',PR:'Принцесса',EM:'Изумруд'};
  let current=null,frame=null,light=new URLSearchParams(location.search).get('light')==='v12'?'v12':'updated',view=new URLSearchParams(location.search).get('view')==='top'?'top':'home';
  function source(m){return m.url+'?light='+light+'&view='+view;}
  function marks(){
   document.getElementById('product').textContent=current.product;
   for(const b of families.children)b.setAttribute('aria-pressed',String(b.dataset.mount===current.mount));
   for(const b of choices.children)b.setAttribute('aria-pressed',String(b.dataset.cut===current.cut));
   for(const b of document.querySelectorAll('[data-light]'))b.setAttribute('aria-pressed',String(b.dataset.light===light));
   for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view));
   separate.href=source(current);
  }
  function choose(product){
   const m=models.find(m=>m.product===product)||models[0];if(current&&current.product===m.product)return;current=m;
   frame=document.createElement('iframe');frame.title=names[m.mount]+' · '+cuts[m.cut]+' · '+m.product;frame.src=source(m);stage.replaceChildren(frame);marks();
   if(location.hash.slice(1)!==m.product)history.replaceState(null,'','#'+m.product);
  }
  function update(){
   const api=frame.contentWindow.ringLightingReview;
   if(api&&api.ready){api.setMode(light);if(api.view!==view)api.setView(view);}else frame.src=source(current);
   marks();
  }
  for(const [mount,label] of Object.entries(names)){const b=document.createElement('button');b.type='button';b.dataset.mount=mount;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.mount===mount&&m.cut===current.cut).product));families.append(b);}
  for(const [cut,label] of Object.entries(cuts)){const b=document.createElement('button');b.type='button';b.dataset.cut=cut;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.cut===cut&&m.mount===current.mount).product));choices.append(b);}
  for(const b of document.querySelectorAll('[data-light]'))b.addEventListener('click',()=>{light=b.dataset.light;update();});
  for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{view=b.dataset.view;update();});
  window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='ring-lighting:state'||e.data.product!==current.product)return;light=e.data.mode;view=e.data.view;marks();});
  window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));choose(location.hash.slice(1));
 })();
