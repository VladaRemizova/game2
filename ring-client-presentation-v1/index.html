 <script>
 (()=>{
  const models=JSON.parse(document.getElementById('models').textContent),families=document.getElementById('families'),choices=document.getElementById('choices'),stage=document.getElementById('stage');
  const names={pave:'С дорожкой',halo:'С ободком'},cuts={BR:'Круг',OV:'Овал',PR:'Принцесса',EM:'Изумруд'};
  const offline=document.getElementById('offline-assets')?JSON.parse(document.getElementById('offline-assets').textContent):null;
  let current=null,frame=null,ready=false,view=new URLSearchParams(location.search).get('view')==='top'?'top':'home';
  function marks(){
   document.getElementById('product').textContent=current.product;
   for(const b of families.children)b.setAttribute('aria-pressed',String(b.dataset.mount===current.mount));
   for(const b of choices.children)b.setAttribute('aria-pressed',String(b.dataset.cut===current.cut));
   for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view));
  }
  function choose(product){
   const m=models.find(m=>m.product===product)||models[0];if(current&&current.product===m.product)return;
   if(frame?.contentWindow.ringPresentation?.dispose)frame.contentWindow.ringPresentation.dispose();
   current=m;ready=false;frame=document.createElement('iframe');frame.title=names[m.mount]+' · '+cuts[m.cut]+' · '+m.product;
   if(offline){
    const end='<'+'/script>';
    const inline='<script id="viewer-initial" type="application/json">'+JSON.stringify({view})+end+
     '<script id="ring-data" type="application/octet-stream">'+offline.models[m.product]+end+
     '<script id="draco-wasm" type="application/octet-stream">'+offline.wasm+end+
     '<script id="draco-wrapper" type="application/octet-stream" data-base64="true">'+offline.wrapper+end+
     '<script src="data:text/javascript;base64,'+offline.viewer+'">'+end;
    frame.srcdoc=offline.pages[m.product].replace('<script src="../viewer.js">'+end,inline);
   }else frame.src=m.url+'?view='+view;
   stage.replaceChildren(frame);marks();if(location.hash.slice(1)!==m.product)history.replaceState(null,'','#'+m.product);
  }
  function update(){if(ready&&frame.contentWindow.ringPresentation?.ready&&frame.contentWindow.ringPresentation.view!==view)frame.contentWindow.ringPresentation.setView(view);marks();}
  for(const [mount,label]of Object.entries(names)){const b=document.createElement('button');b.type='button';b.dataset.mount=mount;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.mount===mount&&m.cut===current.cut).product));families.append(b);}
  for(const [cut,label]of Object.entries(cuts)){const b=document.createElement('button');b.type='button';b.dataset.cut=cut;b.textContent=label;b.addEventListener('click',()=>choose(models.find(m=>m.cut===cut&&m.mount===current.mount).product));choices.append(b);}
  for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{view=b.dataset.view;update();});
  window.addEventListener('message',e=>{
   if(e.source!==frame?.contentWindow||e.origin!==location.origin||e.data?.product!==current?.product)return;
   if(e.data.type==='ring-presentation:ready'){ready=true;update();}
   else if(ready&&e.data.type==='ring-presentation:state'){view=e.data.view;marks();}
  });
  window.addEventListener('hashchange',()=>choose(location.hash.slice(1)));choose(location.hash.slice(1));
 })();
