<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кольцо · Светлый студийный</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fafafa;color:#343737;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;align-items:center}.top{width:min(94vw,1000px);padding:28px 8px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.label{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:#838787}.title{font-family:Georgia,serif;font-weight:400;font-size:23px;margin:8px 0 0}.badge{font-size:11px;color:#737a79;border:1px solid #dedfdd;border-radius:30px;padding:8px 12px}.stage{width:min(96vw,1000px);height:min(78vh,850px);min-height:380px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;opacity:0;outline:none;touch-action:none;transition:opacity .35s}canvas:focus-visible{outline:1px solid #8a9794;outline-offset:-3px;border-radius:15px}.ready canvas{opacity:1}#status{position:absolute;left:0;right:0;top:48%;text-align:center;font-size:13px;color:#8c9390}.bottom{width:min(94vw,1000px);display:flex;justify-content:center;align-items:center;gap:10px;padding:0 8px 18px}button{border:1px solid #d9ddda;background:#fff;color:#48534d;font:12px Arial;border-radius:30px;padding:11px 20px;cursor:pointer}button:hover{background:#edf0ee}button:focus-visible{outline:2px solid #87978d;outline-offset:3px}.hint{font-size:11px;color:#8b928c;margin:0 20px 24px;text-align:center;line-height:1.6}@media(max-width:600px){.top{padding-top:20px}.stage{height:68vh;min-height:370px}.title{font-size:21px}.badge{padding:7px 10px}.label{font-size:10px}.bottom{padding-bottom:14px}}@media(prefers-reduced-motion:reduce){canvas{transition:none}}

.light-label{font-size:11px;color:#7c847f;text-align:center;margin:0 12px 14px}
</style></head><body>
<header class="top"><div><div class="label">La Vivion · 4U20211-OV · 0,7 ct</div><h1 class="title">Кольцо в деталях</h1></div><span class="badge">3D · 360°</span></header>
<main id="viewer" class="stage"><div id="status" role="status">Загружаю кольцо…</div></main>
<p class="light-label">Светлый студийный свет · нейтральные отражения</p>
<div class="bottom"><button id="rotate" aria-pressed="true">Ⅱ Пауза</button><button id="reset">Исходный ракурс</button></div>
<p id="hint" class="hint" hidden>Потяни мышкой или пальцем, чтобы повернуть кольцо.<br>Колёсико или два пальца — приближение.</p>

<script src="./viewer.js?v=bright-studio-v2"></script>
</body></html>
